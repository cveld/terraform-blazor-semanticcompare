name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ade000

      - name: Build and push container image
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          VERSION="${TAG#v}"
          dotnet publish BlazorSemanticCompare/BlazorSemanticCompare.csproj -c Release -r linux-x64 \
            /t:PublishContainer \
            -p:ContainerRegistry=ade000.azurecr.io \
            -p:ContainerRepository=blazorsemanticcompare \
            -p:ContainerImageTags="$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name blazorsemanticcompare \
            --resource-group rg-blazorsemanticcompare \
            --image ade000.azurecr.io/blazorsemanticcompare:$VERSION
